name: Dependabot sync goda.vim

on: pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      - id: pin
        run: |
          rev=$(jq -r '.nodes["goda-vim"].locked.rev' flake.lock)
          if grep -qE "github.com/Shougo/goda.vim v[^ ]*-${rev:0:12}( |\$)" go.mod; then
            echo 'go.mod already matches flake.lock.'
          else
            echo "rev=$rev" >>"$GITHUB_OUTPUT"
          fi
      - if: steps.pin.outputs.rev
        uses: nixbuild/nix-quick-install-action@v35
      - if: steps.pin.outputs.rev
        uses: nix-community/cache-nix-action@v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          save: false
      - if: steps.pin.outputs.rev
        run: |
          nix shell --inputs-from . nixpkgs#go_1_26 -c go get "github.com/Shougo/goda.vim@$REV"
          nix shell --inputs-from . nixpkgs#go_1_26 -c go mod tidy
          nix run --inputs-from . nixpkgs#nix-update -- --flake goda-mp --version=skip
        env:
          REV: ${{ steps.pin.outputs.rev }}
      # A push with GITHUB_TOKEN starts no workflow run, so CI would not see the new commit.
      - if: steps.pin.outputs.rev
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.CI_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CI_BOT_PRIVATE_KEY }}
          permission-contents: write
      # Commits created through the API are signed by GitHub.
      - if: steps.pin.outputs.rev
        shell: bash
        run: |
          parent=$(git rev-parse HEAD)
          base_tree=$(gh api "repos/$REPO/git/commits/$parent" --jq .tree.sha)
          entries='[]'
          while read -r path; do
            blob=$(gh api "repos/$REPO/git/blobs" \
              -f "content=$(base64 -w0 <"$path")" -f encoding=base64 --jq .sha)
            entries=$(jq -c --arg path "$path" --arg sha "$blob" \
              '. + [{path: $path, mode: "100644", type: "blob", sha: $sha}]' <<<"$entries")
          done < <(git diff --name-only -- go.mod go.sum flake.nix)
          tree=$(jq -n --arg base "$base_tree" --argjson tree "$entries" \
            '{base_tree: $base, tree: $tree}' |
            gh api "repos/$REPO/git/trees" --input - --jq .sha)
          commit=$(gh api "repos/$REPO/git/commits" \
            -f "message=build(deps): bump goda.vim in go.mod to ${REV:0:7}" \
            -f "tree=$tree" -f "parents[]=$parent" --jq .sha)
          gh api -X PATCH "repos/$REPO/git/refs/heads/$BRANCH" -f "sha=$commit"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          REV: ${{ steps.pin.outputs.rev }}
